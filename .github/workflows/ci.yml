# Runs every test and checks the Docker image on each push and pull request.
# Results: the "Actions" tab on GitHub. Each run has a summary, plus a downloadable browser-test report.
name: Tests & Docker

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Server & unit tests
        run: >
          mkdir -p reports &&
          node --import tsx --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=reports/unit.xml
          tests/*.test.ts

      - name: Build
        run: npm run build

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (real browser)
        run: npx playwright test

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            if [ -f reports/unit.xml ]; then
              total=$(grep -o '<testcase ' reports/unit.xml | wc -l)
              failed=$(grep -o '<failure' reports/unit.xml | wc -l)
              echo "- Server & unit tests: $((total - failed)) of $total passed"
            fi
            if [ -f reports/e2e.json ]; then
              node -e "const r=require('./reports/e2e.json').stats; console.log('- End-to-end tests: ' + r.expected + ' passed, ' + r.unexpected + ' failed, ' + r.flaky + ' flaky')"
            fi
            echo ""
            echo "The full browser-test report (screenshots and traces of any failure) is under **Artifacts** below: *playwright-report*."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: inkspace:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and check it's healthy
        run: |
          docker run -d --name inkspace -p 3000:3000 \
            -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD=ci-check-password -e APP_URL=http://localhost:3000 \
            inkspace:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/health > /dev/null
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          echo "Home page and health check OK"
          echo "- Docker image builds and starts: health check and home page OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs if it failed
        if: failure()
        run: docker logs inkspace || true

      # Publishes the image to this repository's Packages (ghcr.io) so it can be run anywhere with `docker run`.
      - name: Image name and tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: How to run it
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Run this version"
            echo '```'
            echo "docker run -p 3000:3000 -v inkspace-data:/data -e ADMIN_EMAIL=you@example.com -e ADMIN_PASSWORD=choose-a-password $(echo "${{ steps.meta.outputs.tags }}" | head -1)"
            echo '```'
            echo "Then open http://localhost:3000"
          } >> "$GITHUB_STEP_SUMMARY"
