<!doctype html>
<html lang="en" class="%THEME%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:url" content="%PAGE_URL%" />
    <link rel="canonical" href="%PAGE_URL%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="%FAVICON%" />
    <link rel="preload" href="/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fira-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the visitor's saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
        if (t === 'dark') document.documentElement.classList.add('dark');
        // Phone status bar / browser chrome matches the page.
        document.querySelector('meta[name="theme-color"]').content = document.documentElement.classList.contains('dark') ? '#0E1116' : '#FFFFFF';
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/assets/app.css?v=%BUILD%" />
  </head>
  <body class="bg-brand-light dark:bg-brand-dark text-brand-dark dark:text-brand-light font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/assets/app.js?v=%BUILD%"></script>
  </body>
</html>
